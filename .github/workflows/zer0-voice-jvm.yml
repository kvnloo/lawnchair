name: zer0 voice JVM smoke

on:
  push:
    branches:
      - feat/zer0-voice-navigation
    paths:
      - 'lawnchair/src/app/lawnchair/zer0/voice/**'
      - 'tools/zer0/**'
      - '.github/workflows/zer0-voice-jvm.yml'
  pull_request:
    paths:
      - 'lawnchair/src/app/lawnchair/zer0/voice/**'
      - 'tools/zer0/**'
      - '.github/workflows/zer0-voice-jvm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Check voice grammar and unique app labels
        run: bash tools/zer0/test-voice-commands.sh
